<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CareerGapJobBoard{% endblock %}</title>
{% block meta %}{% endblock %}
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/">CareerGapJobBoard</a>
    <nav>
      <a href="/browse" class="{% if nav == 'browse' %}on{% endif %}">Browse candidates</a>
      <a href="/submit" class="{% if nav == 'submit' %}on{% endif %}">Add your profile</a>
    </nav>
  </div>
</header>
<main>{% block body %}{% endblock %}</main>
<footer class="site">
  <div class="wrap">
    <span>Free for candidates and employers.</span>
    <span>Contact details are shown only to verified employers.</span>
  </div>
</footer>
</body>
</html>
